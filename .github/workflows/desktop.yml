name: Tests & desktop builds

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[build]"
      - name: Build app with PyInstaller
        run: pyinstaller packaging/devtool.spec --noconfirm
      - name: Smoke test the built app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\DevToolkit\DevToolkit.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          Get-Content "$env:USERPROFILE\.devtool\desktop.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "smoke test failed with exit code $($p.ExitCode)" }
      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $version = (Select-String -Path devtool\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$version" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist\installer
      - uses: actions/upload-artifact@v4
        with:
          name: DevToolkit-Windows
          path: dist/installer/*.exe
          if-no-files-found: error

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[build]"
      - name: Build app with PyInstaller
        run: pyinstaller packaging/devtool.spec --noconfirm
      - name: Smoke test the built app
        run: '"dist/Dev Toolkit.app/Contents/MacOS/DevToolkit" --smoke-test'
      - name: Build .dmg
        run: |
          VERSION=$(sed -n 's/__version__ = "\(.*\)"/\1/p' devtool/__init__.py)
          mkdir -p dmg && cp -R "dist/Dev Toolkit.app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Dev Toolkit" -srcfolder dmg -ov -format UDZO "dist/DevToolkit-${VERSION}-macOS.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: DevToolkit-macOS
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
