[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devtool"
version = "1.1.0"
description = "Local offline toolkit for everyday developer tasks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "typer>=0.12",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
desktop = ["pywebview>=5"]
build = ["pywebview>=5", "pyinstaller>=6.6"]

[project.scripts]
devtool = "devtool.cli:app"

[project.gui-scripts]
devtool-app = "devtool.desktop:main"

[tool.setuptools.packages.find]
include = ["devtool*"]

[tool.setuptools.package-data]
devtool = ["static/*", "static/locales/*", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
